name: Eval Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  pull-requests: write   # needed to post PR comments
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: eval-harness
        run: pip install -e ".[dev]"

      - name: Run eval suite
        working-directory: eval-harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_BRANCH: ${{ github.head_ref || github.ref_name }}
          EVAL_GIT_REF: ${{ github.sha }}
        run: |
          python -m runners.cli run \
            --dataset legal_qa \
            --version v1 \
            --model claude-haiku-4-5-20251001 \
            --branch "$EVAL_BRANCH" \
            --git-ref "$EVAL_GIT_REF" \
            --output-dir reports/

      - name: Compare against baseline (main)
        if: github.event_name == 'pull_request'
        working-directory: eval-harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m runners.cli compare \
            --baseline-branch main \
            --candidate-branch "${{ github.head_ref }}" \
            --dataset legal_qa \
            --version v1 \
            --report-path reports/regression.md \
            --threshold-judge 0.3 \
            --threshold-pass-rate 0.05

      - name: Post report as PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: eval-report
          path: eval-harness/reports/regression.md

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports-${{ github.sha }}
          path: eval-harness/reports/
          retention-days: 30
